<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>THE CAMP TAPE - NORA</title>
<style>
:root {
  --bg-color: #e6f4f1;
  --text-color: #0f2942;
  --panel-bg: rgba(255, 255, 255, 0.85);
  --border-color: rgba(15, 41, 66, 0.2);
  --player-blue: #2563eb;
}

body.mode-yoru {
  --bg-color: #0f172a;
  --text-color: #f8fafc;
  --panel-bg: rgba(30, 41, 59, 0.85);
  --border-color: rgba(255, 255, 255, 0.2);
}

body.mode-hiru {
  --bg-color: #fef9e7;
  --text-color: #2c221e;
  --panel-bg: rgba(255, 255, 255, 0.88);
  --border-color: rgba(44, 34, 30, 0.2);
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  user-select: none;
}

body {
  background-color: var(--bg-color);
  color: var(--text-color);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: space-between;
  padding: 24px;
  position: relative;
  transition: background-color 0.5s ease, color 0.5s ease;
  overflow-x: hidden;
}

/* 左上：ブランドヘッダー */
.brand-header {
  position: absolute;
  top: 24px;
  left: 28px;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 6px;
  z-index: 10;
}

.brand-logo {
  height: 24px;
  width: auto;
  object-fit: contain;
}

.copy {
  font-size: 0.8rem;
  letter-spacing: 0.12em;
  font-weight: 400;
  opacity: 0.85;
  white-space: nowrap;
}

/* 中央：タイトルロゴ */
.title-logo-container {
  width: 100%;
  display: flex;
  justify-content: center;
  align-items: center;
  margin-top: 10px;
  margin-bottom: 10px;
  z-index: 5;
}

.title-logo {
  max-width: 320px;
  width: 70%;
  height: auto;
  object-fit: contain;
  filter: drop-shadow(0 4px 10px rgba(0, 0, 0, 0.1));
}

/* メインワークスペース */
.workspace {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: center;
  gap: 36px;
  width: 100%;
  max-width: 800px;
  margin: 10px 0;
}

.stamp-container {
  width: 280px;
  height: 280px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.stamp-img {
  max-width: 100%;
  max-height: 100%;
  object-fit: contain;
  transition: opacity 0.3s ease, transform 0.3s ease;
}

.control-side {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 20px;
}

/* カセットプレーヤー */
.css-player {
  width: 200px;
  height: 290px;
  background: linear-gradient(145deg, rgba(226, 232, 240, 0.9), rgba(203, 213, 225, 0.9));
  border: 3px solid var(--border-color);
  border-radius: 16px;
  box-shadow: 0 12px 24px rgba(0,0,0,0.15);
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 12px;
  position: relative;
  transition: border-color 0.5s ease;
}

.css-player::before {
  content: '';
  position: absolute;
  top: -10px;
  left: 30px;
  width: 16px;
  height: 10px;
  background: #64748b;
  border-radius: 3px 3px 0 0;
}

.player-top-panel {
  width: 100%;
  height: 60px;
  background: var(--player-blue);
  border-radius: 8px;
  margin-bottom: 12px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
}

.vu-meter {
  display: flex;
  gap: 4px;
  align-items: flex-end;
  height: 22px;
  padding: 3px 8px;
  background: rgba(15, 23, 42, 0.85);
  border-radius: 4px;
}

.vu-bar {
  width: 4px;
  height: 20%;
  background: #4ade80;
  border-radius: 1px;
}

.vu-bar:nth-child(4), .vu-bar:nth-child(5) {
  background: #facc15;
}

.is-playing .vu-bar {
  animation: jump 0.35s infinite alternate ease-in-out;
}

.is-playing .vu-bar:nth-child(1) { animation-delay: 0.1s; }
.is-playing .vu-bar:nth-child(2) { animation-delay: 0.25s; }
.is-playing .vu-bar:nth-child(3) { animation-delay: 0.0s; }
.is-playing .vu-bar:nth-child(4) { animation-delay: 0.15s; }
.is-playing .vu-bar:nth-child(5) { animation-delay: 0.3s; }

@keyframes jump {
  0% { height: 15%; }
  100% { height: 95%; }
}

.cassette-window {
  width: 100%;
  height: 110px;
  background: #0f172a;
  border: 2px solid #64748b;
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 20px;
  position: relative;
  overflow: hidden;
}

.reel {
  width: 42px;
  height: 42px;
  border: 3px solid #e2e8f0;
  border-radius: 50%;
  background: radial-gradient(circle, #334155 30%, #0f172a 31%);
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
}

.reel::after, .reel::before {
  content: '';
  position: absolute;
  background: #e2e8f0;
}
.reel::after { width: 100%; height: 3px; }
.reel::before { height: 100%; width: 3px; }

.is-playing .reel {
  animation: spin 1.8s linear infinite;
}

@keyframes spin {
  0% { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}

.tape-bridge {
  position: absolute;
  bottom: 12px;
  width: 120px;
  height: 14px;
  background: #475569;
  border-radius: 2px;
}

.play-btn {
  margin-top: 16px;
  padding: 8px 24px;
  background: #0f172a;
  color: #fff;
  border: none;
  border-radius: 20px;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.12em;
  cursor: pointer;
  box-shadow: 0 4px 10px rgba(0,0,0,0.2);
  transition: all 0.2s ease;
}

.play-btn:active {
  transform: scale(0.95);
}

.cassette-rack {
  display: flex;
  gap: 8px;
}

.cassette-btn {
  padding: 6px 14px;
  background: var(--panel-bg);
  color: var(--text-color);
  border: 1.5px solid var(--border-color);
  border-radius: 12px;
  font-size: 10px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.3s ease;
}

.cassette-btn.active {
  background: #0f172a;
  color: #fff;
  border-color: #0f172a;
}

body.mode-yoru .cassette-btn.active {
  background: #f8fafc;
  color: #0f172a;
  border-color: #f8fafc;
}

/* 下部：SEトレイ */
.se-tray {
  display: flex;
  gap: 10px;
  max-width: 500px;
  width: 100%;
  justify-content: center;
  background: var(--panel-bg);
  padding: 12px 16px;
  border-radius: 32px;
  border: 1.5px solid var(--border-color);
  box-shadow: 0 4px 16px rgba(0,0,0,0.06);
  margin-top: 16px;
  transition: all 0.5s ease;
}

.se-button {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  width: 60px;
  height: 52px;
  border: 1.5px solid var(--border-color);
  border-radius: 14px;
  background: rgba(255, 255, 255, 0.2);
  color: var(--text-color);
  cursor: pointer;
  transition: all 0.2s ease;
}

.se-button.active {
  background: #0f172a;
  color: #fff;
  border-color: #0f172a;
}

body.mode-yoru .se-button.active {
  background: #f8fafc;
  color: #0f172a;
  border-color: #f8fafc;
}

.se-button .icon { font-size: 16px; }
.se-button .label { font-size: 9px; margin-top: 3px; letter-spacing: 0.05em; }

/* 右側：コンセプト ＋ 2026 ＋ シグネチャー エリア */
.right-sidebar {
  position: absolute;
  right: 28px;
  bottom: 24px;
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 12px;
  max-width: 220px;
  text-align: right;
  z-index: 10;
}

.concept-text {
  font-size: 0.75rem;
  line-height: 1.6;
  letter-spacing: 0.08em;
  opacity: 0.8;
  font-weight: 300;
}

.year-text {
  font-size: 0.85rem;
  font-weight: 600;
  letter-spacing: 0.15em;
  opacity: 0.75;
}

.signature-logo {
  height: 28px;
  width: auto;
  object-fit: contain;
  opacity: 0.85;
  transition: filter 0.5s ease, opacity 0.5s ease;
}

/* 夜モード：黒ロゴの反転 */
body.mode-yoru .signature-logo {
  filter: invert(1);
  opacity: 0.9;
}

@media (max-width: 900px) {
  .right-sidebar {
    position: relative;
    right: auto;
    bottom: auto;
    align-items: center;
    text-align: center;
    margin-top: 32px;
    max-width: 100%;
  }
}

@media (max-width: 600px) {
  .brand-header { top: 16px; left: 16px; }
  .brand-logo { height: 20px; }
  .title-logo-container { margin-top: 60px; }
  .title-logo { max-width: 240px; }
}
</style>
</head>
<body class="mode-asa">

<div class="brand-header">
  <img src="images/logo.png" class="brand-logo" alt="nora">
  <div class="copy">音は、時代を旅する。</div>
</div>

<div class="title-logo-container">
  <img src="images/title-logo.png" class="title-logo" alt="THE CAMP TAPE">
</div>

<div class="workspace">
  <div class="stamp-container">
    <img src="images/bg-morning.png" id="stampImg" class="stamp-img" alt="Camp Scene">
  </div>

  <div class="control-side">
    <div class="css-player" id="player">
      <div class="player-top-panel">
        <div class="vu-meter">
          <div class="vu-bar"></div>
          <div class="vu-bar"></div>
          <div class="vu-bar"></div>
          <div class="vu-bar"></div>
          <div class="vu-bar"></div>
        </div>
      </div>

      <div class="cassette-window">
        <div class="reel"></div>
        <div class="reel"></div>
        <div class="tape-bridge"></div>
      </div>

      <button class="play-btn" id="playBtn">PLAY</button>
    </div>

    <div class="cassette-rack">
      <button class="cassette-btn active" data-mode="asa" data-img="images/bg-morning.png" data-sound="sounds/tape-morning.mp3">Morning</button>
      <button class="cassette-btn" data-mode="hiru" data-img="images/bg-midday.png" data-sound="sounds/tape-midday.mp3">Midday</button>
      <button class="cassette-btn" data-mode="yoru" data-img="images/bg-night.png" data-sound="sounds/tape-night.mp3">Night</button>
    </div>
  </div>
</div>

<div class="se-tray">
  <div class="se-button" data-sound="sounds/se-bonfire.mp3"><span class="icon">🔥</span><span class="label">焚き火</span></div>
  <div class="se-button" data-sound="sounds/se-sauna.mp3"><span class="icon">🪨</span><span class="label">サウナ</span></div>
  <div class="se-button" data-sound="sounds/se-river.mp3"><span class="icon">🌊</span><span class="label">川</span></div>
  <div class="se-button" data-sound="sounds/se-cooking.mp3"><span class="icon">🍳</span><span class="label">料理</span></div>
  <div class="se-button" data-sound="sounds/se-onsen.mp3"><span class="icon">♨️</span><span class="label">温泉</span></div>
</div>

<!-- 右側コンセプト・2026・シグネチャーブロック -->
<div class="right-sidebar">
  <p class="concept-text">
  お気に入りの音楽をカセットテープに吹き込んで、キャンプへ。<br><br>

  朝、昼、夜。<br>
  それぞれの時間に流れる音楽と、<br>
  その場所で生まれる自然の音。<br><br>

  音楽と自然が重なり合う。<br>
  その瞬間、自分だけの音楽が生まれる。
</p>
  <div class="year-text">THE CAMP TAPE<br>2026</div>
  <img src="images/nora-1.png" class="signature-logo" alt="Nora Signature">
</div>

<script>
const player = document.getElementById('player');
const playBtn = document.getElementById('playBtn');
const stampImg = document.getElementById('stampImg');
const cassetteBtns = document.querySelectorAll('.cassette-btn');
const seButtons = document.querySelectorAll('.se-button');

let isPlaying = false;
let currentMainAudio = new Audio('sounds/tape-morning.mp3');
currentMainAudio.loop = true;

const seAudioMap = {};

seButtons.forEach(btn => {
  const soundSrc = btn.dataset.sound;
  const audio = new Audio(soundSrc);
  audio.loop = true;
  seAudioMap[soundSrc] = audio;
});

playBtn.addEventListener('click', () => {
  isPlaying = !isPlaying;
  if (isPlaying) {
    player.classList.add('is-playing');
    playBtn.textContent = 'STOP';
    playBtn.style.background = '#e11d48';

    currentMainAudio.play();

    seButtons.forEach(btn => {
      if (btn.classList.contains('active')) {
        const soundSrc = btn.dataset.sound;
        seAudioMap[soundSrc].play();
      }
    });
  } else {
    player.classList.remove('is-playing');
    playBtn.textContent = 'PLAY';
    playBtn.style.background = '#0f172a';

    currentMainAudio.pause();
    Object.values(seAudioMap).forEach(audio => audio.pause());
  }
});

cassetteBtns.forEach(btn => {
  btn.addEventListener('click', () => {
    cassetteBtns.forEach(b => b.classList.remove('active'));
    btn.classList.add('active');

    const mode = btn.dataset.mode;
    document.body.className = `mode-${mode}`;

    stampImg.style.opacity = '0';
    setTimeout(() => {
      stampImg.src = btn.dataset.img;
      stampImg.style.opacity = '1';
    }, 200);

    const soundSrc = btn.dataset.sound;
    const wasPlaying = isPlaying;

    if (wasPlaying) {
      currentMainAudio.pause();
    }
    
    currentMainAudio = new Audio(soundSrc);
    currentMainAudio.loop = true;

    if (wasPlaying) {
      currentMainAudio.play();
    }
  });
});

seButtons.forEach(btn => {
  btn.addEventListener('click', () => {
    btn.classList.toggle('active');
    const soundSrc = btn.dataset.sound;
    const audio = seAudioMap[soundSrc];

    if (isPlaying) {
      if (btn.classList.contains('active')) {
        audio.play();
      } else {
        audio.pause();
        audio.currentTime = 0;
      }
    }
  });
});
</script>
</body>
</html>
